<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Flex-WavelogGate</title>
  <desc id="desc">A bridge from FlexRadio through xCAT to Wavelog, created by Oliver OM0RX.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071523"/>
      <stop offset="0.55" stop-color="#102c3d"/>
      <stop offset="1" stop-color="#0b4f58"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#42e6bd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#8fc7d1" stroke-width="1">
    <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200"/>
    <path d="M120 0V360M240 0V360M360 0V360M480 0V360M600 0V360M720 0V360M840 0V360M960 0V360M1080 0V360"/>
  </g>
  <path d="M55 230h90l20-44 31 96 36-169 35 133 31-68 31 52h82" fill="none" stroke="url(#signal)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="414" cy="230" r="8" fill="#42e6bd"/>
  <path d="M414 230H506" stroke="#42e6bd" stroke-width="5" stroke-linecap="round"/>
  <path d="M488 212l22 18-22 18" fill="none" stroke="#42e6bd" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="550" y="142" fill="#edf9fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="66" font-weight="750" letter-spacing="-2">Flex-WavelogGate</text>
  <text x="554" y="199" fill="#9dd9df" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" letter-spacing="2">FLEXRADIO  ·  xCAT  ·  WAVELOG</text>
  <rect x="552" y="232" width="260" height="52" rx="26" fill="#123f4b" stroke="#42e6bd" stroke-opacity="0.7"/>
  <text x="682" y="266" fill="#d8fff5" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="650">by Oliver · OM0RX</text>
</svg>
